[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

remappings = [
    "@flarenetwork/flare-periphery-contracts/flare/=lib/flare-foundry-periphery-package/src/flare/",
    "@flarenetwork/flare-periphery-contracts/coston2/=lib/flare-foundry-periphery-package/src/coston2/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
