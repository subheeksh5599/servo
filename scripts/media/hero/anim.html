<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 810px; overflow: hidden; background: #0A0A0B; }
  body { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", monospace; color: #EDEDE8; }

  .stage { position: absolute; inset: 0; }

  /* aurora */
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
  .b1 { width: 720px; height: 520px; left: -140px; top: -160px; background: rgba(108,92,231,0.5); }
  .b2 { width: 680px; height: 500px; right: -180px; top: 60px; background: rgba(77,124,254,0.42); }
  .b3 { width: 560px; height: 420px; left: 40%; top: 55%; background: rgba(229,85,199,0.30); }

  /* vignette */
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,11,0.92) 100%); }

  /* coin */
  .coin { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; margin: -95px 0 0 -95px; }
  .coin-core { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(237,237,232,0.85); display: flex; align-items: center; justify-content: center; font-size: 30px; letter-spacing: 0.14em; color: #EDEDE8; background: radial-gradient(circle at 34% 30%, rgba(108,92,231,0.35), rgba(10,10,11,0.2) 70%); box-shadow: 0 0 60px rgba(108,92,231,0.35), inset 0 0 40px rgba(108,92,231,0.15); }
  .ripple { position: absolute; inset: -18px; border-radius: 50%; border: 1.5px solid rgba(108,92,231,0.7); opacity: 0; }

  /* signature */
  .sig-wrap { position: absolute; left: 240px; right: 240px; bottom: 118px; height: 130px; }
  .sig-path { fill: none; stroke: #EDEDE8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 10px rgba(108,92,231,0.6)); }
  .pen { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #6C5CE7; box-shadow: 0 0 22px 6px rgba(108,92,231,0.8); }

  /* caption */
  .cap { position: absolute; left: 64px; bottom: 46px; font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(237,237,232,0.75); }
  .cap b { color: #EDEDE8; font-weight: 400; }
  .tick { position: absolute; right: 64px; top: 52px; font-size: 15px; letter-spacing: 0.18em; color: rgba(237,237,232,0.85); }
  .tick .p { color: #6C5CE7; }
  .ring { position: absolute; right: 64px; top: 40px; width: 7px; height: 7px; border-radius: 50%; background: #6C5CE7; box-shadow: 0 0 12px #6C5CE7; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="vig"></div>

    <div class="ring"></div>
    <div class="tick">FTSO V2 · <span class="p" id="px">XRP/USD</span> <span id="pv">1.082003</span></div>

    <div class="coin">
      <div class="coin-core">XRP</div>
      <div class="ripple r1"></div>
      <div class="ripple r2"></div>
      <div class="ripple r3"></div>
    </div>

    <div class="sig-wrap">
      <svg class="sig-path" id="sig" viewBox="0 0 960 130" preserveAspectRatio="none">
        <path id="sigPath" d="M30 92 C 90 30, 150 110, 215 62 C 250 36, 285 96, 330 84 C 380 70, 415 30, 455 72 C 500 118, 560 40, 610 78 C 660 116, 700 30, 745 62 C 790 94, 830 52, 872 66" />
      </svg>
      <div class="pen" id="pen"></div>
    </div>

    <div class="cap">servo — <b>sign once. your xrp works forever.</b></div>
  </div>

<script>
(function () {
  var DUR = 6;
  var params = new URLSearchParams(location.search);
  var forced = params.get("t");
  var sig = document.getElementById("sigPath");
  var len = sig.getTotalLength();
  var pen = document.getElementById("pen");
  var pv = document.getElementById("pv");
  var ripples = [document.querySelector(".r1"), document.querySelector(".r2"), document.querySelector(".r3")];
  var blobs = [document.querySelector(".b1"), document.querySelector(".b2"), document.querySelector(".b3")];

  // deterministic price walk (same every loop)
  function priceAt(t) {
    var base = 1.0820;
    for (var i = 0; i < Math.floor(t * 8); i++) {
      base += Math.sin(i * 1.7) * 0.00007;
    }
    return base.toFixed(6);
  }

  function render(t) {
    // signature draw
    var prog = (t / DUR) % 1;
    var draw = Math.min(1, prog * 1.6);       // draw in first 62% of loop
    var fade = Math.min(1, Math.max(0, (prog - 0.9) * 10)); // hold then loop
    sig.style.strokeDasharray = len;
    sig.style.strokeDashoffset = len * (1 - draw);
    sig.style.opacity = 0.9;

    // pen tip follows path while drawing
    var tipLen = draw * len * 0.96;
    var pt = sig.getPointAtLength(Math.min(tipLen, len * 0.98));
    var wrap = document.querySelector(".sig-wrap").getBoundingClientRect();
    pen.style.left = (pt.x / 960 * wrap.width - 7) + "px";
    pen.style.top = (pt.y / 130 * wrap.height - 7) + "px";
    pen.style.opacity = draw > 0.02 && draw < 0.97 ? 1 : 0;

    // ripples: three rings, staggered
    for (var i = 0; i < 3; i++) {
      var rp = (prog - i * 0.33 + 1) % 1;
      var s = 1 + rp * 3.2;
      ripples[i].style.transform = "scale(" + s + ")";
      ripples[i].style.opacity = (1 - rp) * 0.55;
    }

    // aurora drift
    blobs[0].style.transform = "translate(" + (Math.sin(t * 0.5) * 30) + "px," + (Math.cos(t * 0.4) * 20) + "px)";
    blobs[1].style.transform = "translate(" + (Math.cos(t * 0.45) * 26) + "px," + (Math.sin(t * 0.6) * 18) + "px)";
    blobs[2].style.transform = "translate(" + (Math.sin(t * 0.35 + 1) * 22) + "px," + (Math.cos(t * 0.5 + 1) * 16) + "px)";

    // price
    pv.textContent = priceAt(t);
  }

  if (forced !== null) {
    render(parseFloat(forced) % DUR);
  } else {
    var t0 = performance.now() / 1000;
    (function loop() {
      var t = (performance.now() / 1000 - t0) % DUR;
      render(t);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
